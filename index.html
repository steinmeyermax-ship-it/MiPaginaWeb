<script>
  (function () {
    const cards = document.querySelectorAll('#servicios .card');
    const gallery = document.getElementById('iniciativas');
    const buttons = document.querySelectorAll('.gallery-tab');
    const items = document.querySelectorAll('.gallery-item');

    // Ocultar inicialmente los programas PDF y la galería.
    document.querySelectorAll('.program-links').forEach(function (links) {
      links.hidden = true;
    });

    gallery.hidden = true;

    // Preparar el espacio para futuras fotos de charlas y conferencias.
    const diffusionPanel = document.createElement('div');
    diffusionPanel.className = 'program-links';
    diffusionPanel.hidden = true;
    diffusionPanel.innerHTML =
      '<p class="program-note">Aquí se mostrarán las fotografías de charlas y conferencias.</p>';
    cards[2].appendChild(diffusionPanel);

    cards.forEach(function (card, index) {
      card.style.cursor = 'pointer';
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'button');
      card.setAttribute('aria-expanded', 'false');

      function toggleCard() {
        const isOpen = card.getAttribute('aria-expanded') === 'true';

        // Cerrar el contenido de este cuadro si ya está abierto.
        card.setAttribute('aria-expanded', String(!isOpen));

        if (index === 0 || index === 1) {
          card.querySelector('.program-links').hidden = isOpen;
        } else if (index === 2) {
          diffusionPanel.hidden = isOpen;
        } else if (index === 3) {
          gallery.hidden = isOpen;
        }
      }

      card.addEventListener('click', function (event) {
        if (event.target.closest('a')) return;
        toggleCard();
      });

      card.addEventListener('keydown', function (event) {
        if (event.target !== card) return;
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleCard();
        }
      });
    });

    // Mantener los filtros actuales de Clases, Visitas y Convivencias.
    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        const filter = button.dataset.filter;

        buttons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === button));
        });

        items.forEach(function (item) {
          item.hidden = item.dataset.category !== filter;
        });
      });
    });

    items.forEach(function (item) {
      item.hidden = item.dataset.category !== 'clases';
    });
  })();
</script>
\n</body>
</html>
